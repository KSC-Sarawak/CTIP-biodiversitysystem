name: CI

# No path filters on purpose: branch protection requires these checks, and a
# workflow that is skipped by a path filter leaves the required check pending
# forever, which blocks the PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  #API
  api:
    name: API (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test
  #end of API
  shared:
    name: Shared (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
  web:
    name: Web (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Mobile app (CTIP-49): the unit tests, then a full Android bundle, which
  # compiles every screen the way a release build does.
  mobile:
    name: Mobile (tests and export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx expo export --platform android --output-dir dist

  # npm audit for the security assessment (CTIP-49, CTIP-74). The full report
  # of each app is kept as a build artifact ("npm-audit-<app>") for 90 days.
  # Only a critical finding fails the check; the rest go in the report.
  audit:
    name: npm audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [services/api, apps/web, apps/mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Save the report
        run: |
          npm audit --json > npm-audit.json || true
          npm audit > npm-audit.txt || true
          cat npm-audit.txt
      - id: name
        run: echo "artifact=npm-audit-$(echo '${{ matrix.app }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            ${{ matrix.app }}/npm-audit.json
            ${{ matrix.app }}/npm-audit.txt
          retention-days: 90
      - name: No critical findings
        run: npm audit --audit-level=critical
