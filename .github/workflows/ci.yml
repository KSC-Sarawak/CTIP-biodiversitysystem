name: CI

# No path filters on purpose: branch protection requires these checks, and a
# workflow that is skipped by a path filter leaves the required check pending
# forever, which blocks the PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  #API
  api:
    name: API (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test
      # F-17: fail on known high or critical holes in the packages the API ships.
      - run: npm audit --omit=dev --audit-level=high
  #end of API
  shared:
    name: Shared (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
  web:
    name: Web (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # F-17: fail on known high or critical holes in the packages the website ships.
      - run: npm audit --omit=dev --audit-level=high
  # F-17: look for keys and passwords in the files of this commit. Rules are in
  # .gitleaks.toml (the default rules plus Supabase sb_secret_ keys, see F-06).
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  # Add jobs here as each workstream gets something to check, e.g.
  # anomaly-detection tests (services/anomaly-detection).
